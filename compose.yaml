services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: andesine
      POSTGRES_PASSWORD: andesine
      POSTGRES_USER: andesine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andesine -d andesine"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  queue-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${QUEUE_REDIS_PORT:-6380}:6379"
    volumes:
      - queue-redis-data:/data

  typesense:
    image: typesense/typesense:30.2
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-typesense-dev-key}
      TYPESENSE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8108/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: node ./dist/migrate.js
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://andesine:andesine@postgres:5432/andesine

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://andesine:andesine@postgres:5432/andesine
      QUEUE_REDIS_URL: redis://queue-redis:6379
      REDIS_URL: redis://redis:6379
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-typesense-dev-key}
      TYPESENSE_URL: http://typesense:8108
    env_file:
      - .env
    ports:
      - "3333:3333"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue-redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://andesine:andesine@postgres:5432/andesine
      QUEUE_REDIS_URL: redis://queue-redis:6379
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-typesense-dev-key}
      TYPESENSE_URL: http://typesense:8108
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_HOST: ${PUBLIC_API_HOST}
        PUBLIC_APP_HOST: ${PUBLIC_APP_HOST}
        PUBLIC_COOKIE_DOMAIN: ${PUBLIC_COOKIE_DOMAIN}
        PUBLIC_SECURE: ${PUBLIC_SECURE}
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  queue-redis-data:
  typesense-data:
